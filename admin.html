<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Jamindar Land Bazaar</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; padding: 15px; background: #f4f6f9; }
    .admin-container { max-width: 1100px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #1a237e; margin-top: 0; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; overflow-x: auto; }
    .tab-btn { padding: 8px 14px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 4px; font-weight: bold; white-space: nowrap; }
    .tab-btn.active { background: #1a237e; color: #fff; }
    .table-responsive { overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
    .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid #ddd; font-size: 14px; }
    .admin-table th { background: #fafafa; }
    .btn-approve { background: #2e7d32; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .btn-reject { background: #c62828; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-left: 4px; }
  </style>
</head>
<body>

<div class="admin-container">
  <h2>Jamindar Land Bazaar - Property Management</h2>

  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchTab('pending', this)">Pending Review</button>
    <button class="tab-btn" onclick="switchTab('approved', this)">Approved (Live)</button>
    <button class="tab-btn" onclick="switchTab('rejected', this)">Rejected</button>
    <button class="tab-btn" onclick="switchTab('all', this)">All Records</button>
  </div>

  <div class="table-responsive">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Property ID</th>
          <th>विक्रेता (Seller)</th>
          <th>लोकेशन</th>
                        <th>खाता / प्लॉट</th>

          <th>विवरण</th>
          <th>कीमत</th>
          <th>स्थिति</th>
          <th>एक्शन</th>
        </tr>
      </thead>
      <tbody id="adminPropertyRows">
        <tr><td colspan="8" style="text-align:center;">डेटा लोड हो रहा है...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // यदि script.js में firebase पहले से शुरू है तो यह उसे उपयोग करेगा
  const db = firebase.firestore();
  let currentTab = 'pending';

  document.addEventListener('DOMContentLoaded', () => {
    loadAdminProperties('pending');
  });

  function switchTab(status, btnElement) {
    currentTab = status;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
    loadAdminProperties(status);
  }

      function loadAdminProperties(statusFilter) {
      const tbody = document.getElementById('adminPropertyRows');
      const savedProps = localStorage.getItem('jlb_saved_properties');
      const properties = savedProps ? JSON.parse(savedProps) : [];

      if (!tbody) return;

      if (properties.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">कोई रिकॉर्ड नहीं मिला</td></tr>';
        return;
      }

      let filtered = properties;
      if (statusFilter !== 'all') {
        filtered = properties.filter(p => (p.status || 'pending') === statusFilter);
      }

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">इस केटेगरी में कोई रिकॉर्ड नहीं है</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const status = p.status || 'pending';
        const badgeColor = status === 'approved' ? '#2e7d32' : status === 'rejected' ? '#c62828' : '#e65100';

        return `
          <tr>
            <td><strong>${p.id}</strong></td>
            <td>${p.sellerName || '-'}<br><small>${p.sellerPhone || '-'}</small></td>
            <td>${p.district || '-'}<br><small>${p.village || p.block || '-'}</small></td>
            <td>
              <strong>खाता:</strong> ${p.khataNo || '-'}<br>
              <small><strong>प्लॉट:</strong> ${p.plotNo || '-'}</small>
            </td>
            <td>${p.category || '-'}<br><small>${p.classType || '-'}</small></td>
            <td>${p.area || '-'}<br><strong>₹${Number(p.priceVal || 0).toLocaleString('en-IN')}</strong></td>
            <td><span style="color:${badgeColor}; font-weight:bold; text-transform:uppercase;">${status}</span></td>
            <td>
              <button class="btn-approve" onclick="updateLocalStatus('${p.id}', 'approved')">Approve</button>
              <button class="btn-reject" onclick="updateLocalStatus('${p.id}', 'rejected')">Reject</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updateLocalStatus(id, newStatus) {
      if (!confirm(`क्या आप वाकई प्रॉपर्टी ${id} को ${newStatus.toUpperCase()} करना चाहते हैं?`)) return;

      let savedProps = localStorage.getItem('jlb_saved_properties');
      let properties = savedProps ? JSON.parse(savedProps) : [];

      properties = properties.map(p => {
        if (p.id === id) {
          p.status = newStatus;
        }
        return p;
      });

            localStorage.setItem('jlb_saved_properties', JSON.stringify(properties));

      alert(`प्रॉपर्टी को सफलतापूर्वक ${newStatus} कर दिया गया!`);
      loadAdminProperties(currentTab);
    }

</script>
</body>
</html>
